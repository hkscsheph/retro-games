<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>運動場圈鍵盤鬥快</title>
    <style>
      :root {
        --bg: #08111f;
        --card: rgba(12, 25, 44, 0.9);
        --text: #eff6ff;
        --muted: #b6c2d2;
        --cyan: #67e8f9;
        --green: #34d399;
        --orange: #fb923c;
        --blue: #60a5fa;
        --track: #b91c1c;
        --track-dark: #7f1d1d;
        --lane: rgba(255, 255, 255, 0.28);
        --field: #166534;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, 'Noto Sans TC', 'PingFang TC', sans-serif;
        color: var(--text);
        background: radial-gradient(
            circle at top,
            rgba(56, 189, 248, 0.18),
            transparent 28%
          ),
          linear-gradient(180deg, #0f172a 0%, #020617 100%);
        padding: 18px;
      }

      .game-shell {
        width: min(1100px, 100%);
        margin: 0 auto;
        background: rgba(2, 6, 23, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 28px;
        padding: 22px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
      }

      .top {
        text-align: center;
        margin-bottom: 18px;
      }

      .top h1 {
        margin: 0 0 8px;
        font-size: clamp(30px, 5vw, 48px);
      }

      .top p {
        margin: 0;
        color: var(--muted);
      }

      .hud {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 14px;
      }

      .panel,
      .controls,
      .bottom-info {
        background: var(--card);
        border: 1px solid rgba(148, 163, 184, 0.14);
      }

      .panel {
        border-radius: 18px;
        padding: 14px;
        text-align: center;
      }

      .panel .label {
        display: block;
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 6px;
      }

      .panel strong {
        font-size: 30px;
      }

      .controls {
        border-radius: 18px;
        padding: 14px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .controls label {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
      }

      select,
      button {
        border: none;
        border-radius: 12px;
        font-size: 16px;
        padding: 12px 16px;
      }

      select {
        background: #e2e8f0;
        color: #0f172a;
        font-weight: 700;
      }

      button {
        cursor: pointer;
        font-weight: 800;
        color: #082032;
        background: linear-gradient(135deg, var(--cyan), var(--green));
      }

      button.ghost {
        background: linear-gradient(135deg, #cbd5e1, #94a3b8);
      }

      .stadium-wrap {
        background: linear-gradient(180deg, #0b1220, #111827);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 24px;
        padding: 18px;
        margin-bottom: 18px;
      }

      .stadium {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        min-height: 320px;
        overflow: hidden;
        border-radius: 22px;
        background: linear-gradient(
            180deg,
            rgba(125, 211, 252, 0.08),
            transparent 18%
          ),
          linear-gradient(180deg, #14532d 0%, #0f3f22 100%);
      }

      .track,
      .field,
      .finish-line {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 999px;
      }

      .outer-line {
        width: 78%;
        height: 58%;
        background: linear-gradient(180deg, #ef4444, #7f1d1d);
        box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.08),
          0 20px 40px rgba(0, 0, 0, 0.24);
      }

      .lane {
        border: 2px solid rgba(255, 255, 255, 0.28);
      }

      .lane-1 {
        width: 72.5%;
        height: 53%;
      }

      .lane-2 {
        width: 66.5%;
        height: 48%;
      }

      .lane-3 {
        width: 60.5%;
        height: 43%;
      }

      .field {
        width: 54.5%;
        height: 37%;
        background: repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.04) 0 34px,
            rgba(0, 0, 0, 0.04) 34px 68px
          ),
          linear-gradient(180deg, #22c55e 0%, #166534 100%);
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.08);
      }

      .finish-line {
        width: 18px;
        height: 110px;
        left: 12.5%;
        background: linear-gradient(
          45deg,
          #fff 25%,
          #111 25%,
          #111 50%,
          #fff 50%,
          #fff 75%,
          #111 75%,
          #111 100%
        );
        background-size: 16px 16px;
        transform: translate(-50%, -50%) rotate(-6deg);
        z-index: 3;
        border-radius: 4px;
      }

      .runner {
        position: absolute;
        left: 0;
        top: 0;
        transform: translate(-50%, -50%);
        width: 62px;
        height: 62px;
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-weight: 800;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
        transition: left 0.06s linear, top 0.06s linear, transform 0.08s ease;
        z-index: 4;
      }

      .runner span {
        font-size: 26px;
      }
      .runner small {
        font-size: 12px;
      }

      .runner.you {
        background: radial-gradient(circle at 30% 30%, #fdba74, #fb923c);
      }

      .runner.cpu {
        background: radial-gradient(circle at 30% 30%, #bfdbfe, #60a5fa);
      }

      .runner.bounce {
        transform: translate(-50%, -50%) scale(1.1);
      }

      .bottom-info {
        border-radius: 20px;
        padding: 16px;
      }

      .status {
        font-size: clamp(20px, 3vw, 34px);
        font-weight: 900;
        text-align: center;
        color: #fde68a;
        min-height: 44px;
        margin-bottom: 16px;
      }

      .bars {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .bar-title {
        margin-bottom: 8px;
        color: var(--muted);
      }

      .bar {
        width: 100%;
        height: 16px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
      }

      .fill {
        width: 0%;
        height: 100%;
        border-radius: 999px;
        transition: width 0.08s linear;
      }

      .you-fill {
        background: linear-gradient(90deg, #f59e0b, #f97316);
      }

      .cpu-fill {
        background: linear-gradient(90deg, #60a5fa, #22d3ee);
      }

      .tips {
        margin: 14px 0 0;
        color: var(--muted);
        text-align: center;
        line-height: 1.6;
      }

      @media (max-width: 860px) {
        .hud,
        .bars {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 640px) {
        body {
          padding: 10px;
        }
        .game-shell {
          padding: 14px;
        }
        .hud,
        .bars {
          grid-template-columns: 1fr;
        }
        .runner {
          width: 54px;
          height: 54px;
        }
        .runner span {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <header class="top">
        <h1>運動場圈鍵盤鬥快</h1>
        s
        <p>你要喺運動場跑一個圈，狂撳指定鍵，鬥快贏電腦。</p>
      </header>

      <section class="hud">
        <div class="panel">
          <span class="label">目標按鍵</span>
          <strong id="targetKey">A</strong>
        </div>
        <div class="panel">
          <span class="label">倒數</span>
          <strong id="countdown">3</strong>
        </div>
        <div class="panel">
          <span class="label">你嘅次數</span>
          <strong id="hits">0</strong>
        </div>
        <div class="panel">
          <span class="label">難度</span>
          <strong id="difficultyText">普通</strong>
        </div>
      </section>

      <section class="controls">
        <label>
          電腦速度
          <select id="difficulty">
            <option value="easy">易</option>
            <option value="normal" selected>普通</option>
            <option value="hard">難</option>
          </select>
        </label>
        <button id="startBtn">開始</button>
        <button id="resetBtn" class="ghost">重置</button>
      </section>

      <section class="stadium-wrap">
        <div class="stadium">
          <div class="track outer-line"></div>
          <div class="track lane lane-1"></div>
          <div class="track lane lane-2"></div>
          <div class="track lane lane-3"></div>
          <div class="field"></div>
          <div class="finish-line"></div>

          <div class="runner you" id="youRunner">
            <span>🏃</span>
            <small>你</small>
          </div>

          <div class="runner cpu" id="cpuRunner">
            <span>💻</span>
            <small>電腦</small>
          </div>
        </div>
      </section>

      <section class="bottom-info">
        <div class="status" id="status">撳開始準備起跑</div>
        <div class="bars">
          <div>
            <div class="bar-title">你嘅圈速進度</div>
            <div class="bar">
              <div class="fill you-fill" id="youFill"></div>
            </div>
          </div>
          <div>
            <div class="bar-title">電腦圈速進度</div>
            <div class="bar">
              <div class="fill cpu-fill" id="cpuFill"></div>
            </div>
          </div>
        </div>
        <p class="tips">
          玩法：倒數完之後，見到咩鍵就撳咩鍵。每次撳中，角色會沿住運動場跑道前進一截。
        </p>
      </section>
    </main>

    <script>
      var targetKeyEl = document.getElementById('targetKey');
      var countdownEl = document.getElementById('countdown');
      var hitsEl = document.getElementById('hits');
      var difficultyText = document.getElementById('difficultyText');
      var statusEl = document.getElementById('status');
      var youRunner = document.getElementById('youRunner');
      var cpuRunner = document.getElementById('cpuRunner');
      var youFill = document.getElementById('youFill');
      var cpuFill = document.getElementById('cpuFill');
      var difficultySelect = document.getElementById('difficulty');
      var startBtn = document.getElementById('startBtn');
      var resetBtn = document.getElementById('resetBtn');

      var keys = ['A', 'S', 'D', 'F', 'J', 'K', 'L'];
      var profiles = {
        easy: { min: 0.003, max: 0.006, label: '易' },
        normal: { min: 0.0045, max: 0.0075, label: '普通' },
        hard: { min: 0.006, max: 0.0095, label: '難' },
      };

      var targetKey = 'A';
      var hits = 0;
      var playerProgress = 0;
      var cpuProgress = 0;
      var playing = false;
      var finished = false;
      var countdownTimer = null;
      var raceTimer = null;

      function randomKey() {
        return keys[Math.floor(Math.random() * keys.length)];
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function getTrackPoint(progress, lane) {
        var t = Math.PI + progress * Math.PI * 2;
        var cx = 50;
        var cy = 50;
        var rx = lane === 'you' ? 36 : 30.5;
        var ry = lane === 'you' ? 25 : 20;

        return {
          x: cx + rx * Math.cos(t),
          y: cy + ry * Math.sin(t),
        };
      }

      function placeRunner(el, progress, lane) {
        var p = getTrackPoint(progress, lane);
        el.style.left = p.x + '%';
        el.style.top = p.y + '%';
      }

      function flashRunner(el) {
        el.classList.remove('bounce');
        void el.offsetWidth;
        el.classList.add('bounce');
      }

      function updateUI() {
        targetKeyEl.textContent = targetKey;
        hitsEl.textContent = hits;
        difficultyText.textContent = profiles[difficultySelect.value].label;

        if (playing) {
          countdownEl.textContent = 'GO';
        }

        youFill.style.width = playerProgress * 100 + '%';
        cpuFill.style.width = cpuProgress * 100 + '%';

        placeRunner(youRunner, playerProgress, 'you');
        placeRunner(cpuRunner, cpuProgress, 'cpu');
      }

      function resetGame(message) {
        if (!message) {
          message = '撳開始準備起跑';
        }

        clearInterval(countdownTimer);
        clearInterval(raceTimer);

        targetKey = randomKey();
        hits = 0;
        playerProgress = 0;
        cpuProgress = 0;
        playing = false;
        finished = false;

        countdownEl.textContent = '3';
        statusEl.textContent = message;
        updateUI();
      }

      function finishRace(winner) {
        finished = true;
        playing = false;
        clearInterval(raceTimer);
        countdownEl.textContent = '完';

        if (winner === 'you') {
          statusEl.textContent = '你贏咗一個圈！';
        } else {
          statusEl.textContent = '電腦快你一步衝線！';
        }
      }

      function startRaceLoop() {
        var profile = profiles[difficultySelect.value];

        raceTimer = setInterval(function () {
          if (!playing || finished) return;

          cpuProgress +=
            profile.min + Math.random() * (profile.max - profile.min);
          cpuProgress = clamp(cpuProgress, 0, 1);

          if (cpuProgress >= 1) {
            updateUI();
            finishRace('cpu');
            return;
          }

          updateUI();
        }, 60);
      }

      function startCountdown() {
        var count = 3;
        countdownEl.textContent = count;
        statusEl.textContent = '預備...';

        clearInterval(countdownTimer);

        countdownTimer = setInterval(function () {
          count -= 1;

          if (count > 0) {
            countdownEl.textContent = count;
            statusEl.textContent = '準備開跑...';
          } else if (count === 0) {
            countdownEl.textContent = 'GO';
            statusEl.textContent = '快啲撳 ' + targetKey;
            playing = true;
            startRaceLoop();
          } else {
            clearInterval(countdownTimer);
          }
        }, 850);
      }

      document.addEventListener('keydown', function (e) {
        if (!playing || finished) return;

        var pressed = e.key.toUpperCase();
        if (pressed !== targetKey) return;

        hits += 1;
        playerProgress += 0.055;
        playerProgress = clamp(playerProgress, 0, 1);
        flashRunner(youRunner);

        if (playerProgress >= 1) {
          updateUI();
          finishRace('you');
          return;
        }

        targetKey = randomKey();
        statusEl.textContent = '繼續撳 ' + targetKey;
        updateUI();
      });

      startBtn.addEventListener('click', function () {
        resetGame('倒數中...');
        startCountdown();
      });

      resetBtn.addEventListener('click', function () {
        resetGame();
      });

      difficultySelect.addEventListener('change', function () {
        difficultyText.textContent = profiles[difficultySelect.value].label;
      });

      resetGame();
    </script>
  </body>
</html>
