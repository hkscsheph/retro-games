<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>Infinite Neon Pulse</title>
    <style>
      body {
        margin: 0;
        background: #000;
        color: #fff;
        overflow: hidden;
        font-family: 'Arial Black', sans-serif;
      }
      canvas {
        position: fixed;
        top: 0;
        left: 0;
      }
      .ui {
        position: fixed;
        top: 20px;
        width: 100%;
        text-align: center;
        z-index: 10;
        pointer-events: none;
      }
      #score {
        font-size: 2rem;
        color: #00e5ff;
        text-shadow: 0 0 15px #00e5ff;
      }
      #combo {
        font-size: 1.5rem;
        color: #ff00ff;
        margin-top: 10px;
        opacity: 0;
      }
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle, #1a0033 0%, #000 100%);
        z-index: 20;
      }
      .btn {
        padding: 15px 50px;
        background: #ff00ff;
        color: #fff;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1.2rem;
        box-shadow: 0 0 20px #ff00ff;
        transition: 0.3s;
      }
      .btn:hover {
        transform: scale(1.1);
        box-shadow: 0 0 40px #ff00ff;
      }
      .hit-bar {
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 40px;
        z-index: 5;
      }
      .lane-hint {
        width: 60px;
        height: 60px;
        border: 3px solid rgba(0, 229, 255, 0.3);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        color: #00e5ff;
      }
      .active {
        background: #00e5ff;
        color: #000;
        box-shadow: 0 0 30px #00e5ff;
      }
    </style>
  </head>
  <body>
    <canvas id="visualizer"></canvas>

    <div class="ui">
      <div id="score">SCORE: 00000</div>
      <div id="combo">COMBO x0</div>
    </div>

    <div id="startScreen" class="overlay">
      <h1>INFINITE PULSE</h1>
      <p>系統自動生成電音節奏</p>
      <button id="startBtn" class="btn">START GAME</button>
      <div class="keys-info">鍵盤：[A] [S] [D] [F]</div>
    </div>

    <div class="hit-bar">
      <div class="lane-hint">A</div>
      <div class="lane-hint">S</div>
      <div class="lane-hint">D</div>
      <div class="lane-hint">F</div>
    </div>

    <script>
      const canvas = document.getElementById('visualizer');
      const ctx = canvas.getContext('2d');
      const startBtn = document.getElementById('startBtn');

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let audioCtx,
        notes = [],
        score = 0,
        combo = 0;
      let nextNoteTime = 0;
      const lanePos = [
        canvas.width / 2 - 150,
        canvas.width / 2 - 50,
        canvas.width / 2 + 50,
        canvas.width / 2 + 150,
      ];

      // --- 自動生成音樂 (Synthesizer) ---
      function playBeat(time) {
        // 簡單嘅踢鼓聲 (Kick Drum)
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(150, time);
        osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
        gain.gain.setValueAtTime(1, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(time);
        osc.stop(time + 0.5);

        // 每一下節拍自動生一個遊戲方塊
        const lane = Math.floor(Math.random() * 4);
        notes.push({
          x: lanePos[lane],
          y: -50,
          lane: lane,
          speed: 7,
          time: time,
        });
      }

      // --- 震撼背景渲染 ---
      function drawScene() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 隨機霓虹線條背景
        ctx.strokeStyle = '#330066';
        for (let i = 0; i < canvas.width; i += 100) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i + (Math.random() - 0.5) * 50, canvas.height);
          ctx.stroke();
        }

        // 畫出音符
        notes.forEach((note, i) => {
          note.y += note.speed;
          ctx.fillStyle = `hsl(${note.lane * 70 + 200}, 100%, 50%)`;
          ctx.shadowBlur = 20;
          ctx.shadowColor = ctx.fillStyle;
          ctx.fillRect(note.x - 35, note.y, 70, 15);

          if (note.y > canvas.height) {
            notes.splice(i, 1);
            combo = 0;
            document.getElementById('combo').style.opacity = 0;
          }
        });

        // 節拍器控制邏輯
        if (audioCtx && audioCtx.currentTime + 0.2 > nextNoteTime) {
          playBeat(nextNoteTime);
          nextNoteTime += 0.5; // 每 0.5 秒一拍 (120 BPM)
        }

        requestAnimationFrame(drawScene);
      }

      // --- 互動控制 ---
      window.onkeydown = (e) => {
        const keys = { a: 0, s: 1, d: 2, f: 3 };
        if (e.key.toLowerCase() in keys) {
          const lane = keys[e.key.toLowerCase()];
          const hints = document.querySelectorAll('.lane-hint');
          hints[lane].classList.add('active');
          setTimeout(() => hints[lane].classList.remove('active'), 100);

          const hitIdx = notes.findIndex(
            (n) =>
              n.lane === lane &&
              n.y > canvas.height - 150 &&
              n.y < canvas.height - 50
          );
          if (hitIdx !== -1) {
            score += 100;
            combo++;
            notes.splice(hitIdx, 1);
            document.getElementById('score').innerText = `SCORE: ${score}`;
            document.getElementById('combo').innerText = `COMBO x${combo}`;
            document.getElementById('combo').style.opacity = 1;
          }
        }
      };

      startBtn.onclick = () => {
        document.getElementById('startScreen').style.display = 'none';
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        nextNoteTime = audioCtx.currentTime;
        drawScene();
      };
    </script>
  </body>
</html>
