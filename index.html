<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NES Game Vault</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="crt-overlay"></div>

    <div class="nes-container">
      <div id="menu-view">
        <header>
          <h1 class="glow-title">選擇遊戲</h1>
          <div class="insert-coin">PLEASE INSERT COIN _</div>
          <div class="line-divider"></div>
        </header>
        <main id="game-grid" class="game-grid"></main>
      </div>

      <div id="game-view" style="display: none">
        <header>
          <button class="retro-btn" onclick="closeGame()">◀ BACK</button>
        </header>
        <iframe id="game-frame" src="" frameborder="0"></iframe>
      </div>
    </div>

    <script>
      async function loadGames() {
        const grid = document.getElementById('game-grid');

        try {
          const response = await fetch('games.json');
          const games = await response.json();

          grid.innerHTML = games
            .sort((a, b) => 0.5 - Math.random())
            .filter((x, i) => i < 8)
            .map(
              (game) => `
                <a href="${game.code}.html" class="game-card" onclick="openGame(event, '${game.code}.html')">
                    <div class="thumbnail-wrapper">
                        <img src="${game.code}.jpg" alt="${game.title}">
                    </div>
                    <div class="game-title">${game.title}</div>
                </a>
            `
            )
            .join('');
        } catch (error) {
          console.error('Error loading the game list:', error);
          grid.innerHTML = '<p class="error-text">ERROR LOADING SYSTEM...</p>';
        }
      }

      // --- NEW FUNCTIONS FOR VIEW SWITCHING ---

      function openGame(event, gameUrl) {
        event.preventDefault(); 
        
        document.getElementById('menu-view').style.display = 'none';
        document.getElementById('game-view').style.display = 'flex';
        
        const iframe = document.getElementById('game-frame');
        
        iframe.onload = function() {
            // 1. Focus the game so keyboard inputs work
            iframe.contentWindow.focus();

            // 2. Attach idle tracking to the inside of the iframe!
            // Note: This only works if your HTML files are hosted on the same domain/server (No cross-origin restrictions)
            try {
              activityEvents.forEach(event => {
                iframe.contentDocument.addEventListener(event, resetIdleTimer, true);
              });
            } catch (e) {
              console.warn("Could not attach idle tracker to iframe due to cross-origin security.", e);
            }
        };

        iframe.src = gameUrl;
        iframe.focus();
        window.scrollTo(0, 0);
        
        // Reset timer just in case clicking the game took a second
        resetIdleTimer();
      }
      function closeGame() {
        // Hide game, show menu
        document.getElementById('game-view').style.display = 'none';
        document.getElementById('menu-view').style.display = 'block';

        // Clear the iframe source so the game stops running/playing audio in the background
        document.getElementById('game-frame').src = '';
      }

      // Initialize the catalog
      loadGames();

      // --- IDLE AUTO-RELOAD (ATTRACT MODE) ---
      let idleTimer;
      const IDLE_TIMEOUT = 300000; // 10 seconds in milliseconds

      function resetIdleTimer() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          // Reloads the entire page, resetting everything
          window.location.reload();
        }, IDLE_TIMEOUT);
      }

      // Track activity on the main page
      const activityEvents = ['mousemove', 'keydown', 'mousedown', 'touchstart', 'scroll'];
      activityEvents.forEach(event => {
        // We use 'true' for the capture phase to catch events as early as possible
        window.addEventListener(event, resetIdleTimer, true);
      });

      // Start the timer as soon as the page loads
      resetIdleTimer();
    </script>
  </body>
</html>
